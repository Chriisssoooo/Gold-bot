name: Signaux Gold

on:
  schedule:
    - cron: "50 8-14 * * 1-5"
    - cron: "5 16 * * 1-5"
  workflow_dispatch:
    inputs:
      cmd:
        description: "test, trade ou bilan"
        default: "test"

permissions:
  contents: write

concurrency:
  group: gold
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Lancer le bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWELVE_KEY: ${{ secrets.TWELVE_KEY }}
          CMD: ${{ github.event.inputs.cmd }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$SCHEDULE" = "5 16 * * 1-5" ]; then CMD=bilan; fi
          if [ -z "$CMD" ]; then CMD=trade; fi
          python bot.py "$CMD"
      - name: Sauver le journal
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add journal.csv || true
          git commit -m "journal" || true
          git push || true
